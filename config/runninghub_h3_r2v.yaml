  per_group:
    picture_2: "characters/char_girl/references/girl_master.png"
    picture_3: "characters/group_ninjas/references/ninjas_master.png"
    picture_4: "locations/loc_old_town/references/old_town_master.png"
    picture_5: "references/props/mechanical_medallion/references/medallion_master.png"
  rules:
    - "не запускать до добавления и утверждения Picture 1"
    - "не менять номера Picture между material groups"
    - "не использовать пустой tag Picture в prompt"
    - "загружать только персонажей, присутствующих в конкретном шоте"
    - "Picture 5 использовать только в шотах, где медальон виден в кадре"

