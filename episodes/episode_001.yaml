schema_version: "1.0-example"
episode:
  id: "ep001"
  title: "Незнакомка в старом городе"
  status: "outline"
  logline: "Во время прогулки по старому европейскому городу Дёма замечает нападение на девушку, вступается за неё и после стремительной схватки вынужден бежать вместе с ней от преследователей."
  synopsis: "Дёма беззаботно идёт по старому городу, пока не замечает, как группа ниндзя окружает испуганную девушку. Он не проходит мимо и вмешивается. Используя скорость, находчивость, акробатику и предметы городской улицы, Дёма обезвреживает нападающих без жестокости. Победа оказывается временной: на площади появляются новые преследователи. Девушка хватает Дёму за руку, и они скрываются в переулках. Перед тем как раствориться в городе, она показывает загадочный предмет, из-за которого за ней охотятся, открывая главную тайну продолжения."
  target_duration_seconds: 65
  continuity_from_previous_episode: "none — первая серия"
  story_time:
    era: "вымышленное позднее Средневековье на рубеже раннего Возрождения"
    production_anchor: "около 1480 года; допустимый визуальный диапазон 1470–1500"
    calendar_date: "не называется в кадре"
    episode_window: "один поздний день, переходящий в золотой час"

story:
  premise: "Случайная прогулка знакомит Дёму с девушкой, которую преследует таинственная группа."
  protagonist_goal: "Сначала спокойно пройти через город, затем защитить девушку и помочь ей уйти от преследователей."
  central_conflict: "Дёма противостоит численно превосходящей группе ниндзя и пытается понять, почему они преследуют девушку."
  stakes: "Если Дёма не вмешается, девушку схватят; после вмешательства целью преследователей становится и он сам."
  ending_state: "Дёма и девушка временно отрываются от погони; активированный механический медальон показывает детализированную карту города и маршрут от фонтана к скрытой точке у башни."
  beats:
    - id: "beat_001"
      description: "Дёма гуляет по старому городу; спокойный ритм знакомит зрителя с героем и пространством."
      scene_ids: ["ep001_sc010"]
    - id: "beat_002"
      description: "Дёма слышит шум, замечает девушку в окружении ниндзя и решает вмешаться."
      scene_ids: ["ep001_sc010", "ep001_sc020"]
    - id: "beat_003"
      description: "Дёма побеждает первую группу благодаря ловкости, импровизации и предметам окружения."
      scene_ids: ["ep001_sc020"]
    - id: "beat_004"
      description: "Появляется новая группа преследователей; Дёма и девушка убегают через переулки."
      scene_ids: ["ep001_sc030"]
    - id: "beat_005"
      description: "Девушка активирует механический медальон; его три кольца складываются в детализированную карту города с маршрутом к башне, создавая крючок второй серии."
      scene_ids: ["ep001_sc030"]

cast:
  character_ids: ["char_dema", "char_girl", "group_ninjas"]

locations:
  location_ids: ["loc_old_town"]

scenes:
  - id: "ep001_sc010"
    title: "Прогулка и нападение"
    manifest: "scenes/ep001/sc010/scene.yaml"
    purpose: "Представить Дёму, город и момент, когда герой решает помочь незнакомке."
    location_id: "loc_old_town"
    time_of_day: "поздний день"
    character_ids: ["char_dema", "char_girl", "group_ninjas"]
    estimated_duration_seconds: 20
    status: "planned"
    shot_ids: ["ep001_sc010_sh010", "ep001_sc010_sh020", "ep001_sc010_sh030", "ep001_sc010_sh040"]
  - id: "ep001_sc020"
