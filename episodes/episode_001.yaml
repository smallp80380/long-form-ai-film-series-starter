    manifest: "scenes/ep001/sc020/scene.yaml"
    purpose: "Раскрыть смелость и находчивый комедийный стиль действия Дёмы."
    location_id: "loc_old_town"
    time_of_day: "поздний день"
    character_ids: ["char_dema", "char_girl", "group_ninjas"]
