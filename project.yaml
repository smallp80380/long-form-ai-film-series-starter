schema_version: "1.0-example"
project:
  id: "dema_series"
  title: "Дёма"
  format: "series" # series | feature | short
  logline: "Обычная прогулка мальчика Дёмы каждый раз превращается в большое приключение, где смелость, находчивость и чувство юмора помогают ему защищать тех, кто оказался в беде."
  synopsis: "Приключенческий сериал о мальчике Дёме, который неожиданно оказывается в центре опасных событий и действует не как непобедимый супергерой, а как смелый, быстрый и изобретательный герой."
  language: "ru"
  status: "development"

execution:
  allow_generation: false
  allow_external_api_calls: false
  require_explicit_confirmation_per_paid_run: true
  dry_run_only_until_approved: true

backend_policy:
  replicate:
    allowed: false
  comfyui_cloud:
    allowed: true
    role: "keyframes, reference editing, optional Wan motion workflows"
    require_live_inventory_check: true
    workflow_id: null
  runninghub:
    allowed: true
    payment_method: "RH Coins only"
    role: "MiniMax H3 long-form shots, optional hosted Wan workflows"
    require_coin_estimate_before_run: true
    workflow_or_app_id: "2094582511883345922"
    workflow_name: "MiniMax H3 Director's Desk All-in-One"
    production_profile: "config/runninghub_h3_r2v.yaml"

creative_bible:
  genre: "семейное приключение, экшен-комедия"
  tone: "динамичный, добрый, напряжённый без жестокости, с физической комедией"
  visual_style: "кинематографичный вымышленный европейский город позднего Средневековья на рубеже раннего Возрождения, визуальный эквивалент около 1480 года"
  world_period:
    calendar: "вымышленный мир; реальная историческая дата в кадре не указывается"
    visual_equivalent: "Западная и Южная Европа, около 1470–1500 годов"
    production_anchor_year: 1480
    rule: "допустима сказочная механика медальона, но городская среда, костюмы и бытовой реквизит не должны выглядеть современными"
  color_palette:
    - "тёплый камень и терракота старого города"
    - "прохладные синие тени узких улиц"
    - "яркий цветовой акцент в одежде Дёмы после утверждения фото"
  camera_rules:
    - "сохранять понятную экранную географию и направление движения"
    - "экшен показывать преимущественно общими и средними планами"
    - "не использовать чрезмерную тряску камеры и хаотичный монтаж"
    - "удары строить через тайминг, уклонения и предметы окружения, без смакования насилия"
  forbidden_visual_changes:
    - "не менять возраст, лицо, причёску и телосложение Дёмы между шотами"
    - "не превращать семейный экшен в жестокую или кровавую сцену"
    - "не добавлять автомобили, электрическое освещение, пластик, современную рекламу, складную мебель или современную одежду"

delivery:
  aspect_ratio: "16:9"
  width: 1920
  height: 1080
  timeline_fps: 24
  audio_sample_rate_hz: 48000
  review_codec: "H.264"
  master_codec: "<choose_later>"
  color_space: "Rec.709"

naming:
  episode: "ep###"
  scene: "ep###_sc###"
  shot: "ep###_sc###_sh###"
  take: "ep###_sc###_sh###_tk###"
  segment: "ep###_sc###_sh###_tk###_seg##"

paths:
  characters: "characters"
  locations: "locations"
  episodes: "episodes"
  scenes: "scenes"
  shots: "shots"
  references: "references"
  workflows: "workflows"
  prompts: "prompts"
  audio: "audio"
  outputs: "outputs"
  logs: "logs"
