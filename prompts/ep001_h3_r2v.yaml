common_prompt: >-
  Exact 16:9 widescreen cinematic frame, landscape orientation. Family-friendly
  cinematic action comedy in a fictional late-medieval European canal city,
  visually equivalent to circa 1480. Preserve the radial city geography from
  <Picture 4>: fountain square, irregular stone blocks, turquoise canals, arched
  bridges, stairs, fortified walls, gates and round towers.
  Preserve the exact identity, age, face, hair, body proportions and outfit of
  <Picture 1> as Dema. Clear screen direction, readable full-body motion,
  realistic weight and contact, natural late-afternoon light. No blood, no injury,
  no weapons, no text, no logos, no identity drift, no costume change. Never use
  portrait, vertical, square, pillarboxed or cropped composition. No cars, asphalt,
  electricity, plastic, modern signage, modern storefronts or contemporary clothing.

groups:
