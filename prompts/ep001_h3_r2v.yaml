    prompt: "Wide 35mm tracking shot. <Picture 1> walks calmly through a lively stone street inside the walled city, curious and observant. Two-story limestone houses, timber shutters, terracotta roofs, handcarts and natural market ambience."
  ep001_sc010_sh020:
