schema_version: "1.0"
prop:
  id: "prop_mechanical_map_medallion"
  name: "Механический медальон-карта"
  status: "visual_design_approved_master_file_pending_import"
  story_function: "Показывает детализированную карту старого города и запускает тайну следующей серии."

physical_design:
  diameter_mm: 55
  thickness_mm: 9
  material: "состаренная латунь"
  accent: "матовая бирюзовая эмаль"
  mechanism: "три концентрических вращающихся кольца"
  safe_edges: true

activated_state:
  required_as_primary_reference: true
  description: >-
    Все три кольца раскрыты и механически зафиксированы в одной плоскости. Вся лицевая
    поверхность медальона занята детализированной картой старого европейского города.
  map_detail:
    - "извилистые улицы и узкие переулки разной ширины"
    - "центральная площадь с круглым фонтаном"
    - "каменная лестница, крытая арка, мост и башня"
    - "кварталы домов, внутренние дворы и городская стена"
    - "один непрерывный бирюзовый маршрут от площади к скрытой точке у башни"
  visual_rules:
    - "карта выгравирована и заполнена эмалью непосредственно на металле"
    - "детали карты переходят через границы всех трёх колец и точно совмещаются"
    - "маршрут и ключевые ориентиры читаются в крупном плане"
    - "только линии маршрута дают слабое тёплое свечение"
    - "никакой проекции, голограммы или парящей карты"

reference_requirements:
  master: "references/props/mechanical_medallion/references/medallion_master.png"
  candidates_directory: "references/props/mechanical_medallion/candidates"
  required_views:
    - "активированный вид спереди как главный крупный вид"
    - "макрокадр детализированной карты"
    - "закрытый вид спереди"
    - "вид сзади"
    - "вид сбоку"
    - "масштаб рядом с нейтральной детской ладонью"
  approved: []
  approval_note: "Пользователь утвердил приложенное изображение 2026-09-30; бинарный master-файл ещё не импортирован в репозиторий."

negative_constraints:
  - "не упрощать карту до нескольких линий или абстрактного лабиринта"
  - "не добавлять текст, буквы, цифры, подписи или легенду карты"
  - "не менять число колец, материал, размер или бирюзовый акцент"
  - "не использовать реальные планы городов, гербы или узнаваемые памятники"
  - "не добавлять драгоценные камни, оружейные детали или острые края"
